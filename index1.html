<!DOCTYPE html>
<html lang="en">
<head>
  <script src='//libtl.com/sdk.js' data-zone='11878821' data-sdk='show_11878821'></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14532d">
  <title>Reward BD</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; min-height: 100vh;
      font-family: Arial, sans-serif; color: #0f172a;
      background: linear-gradient(180deg, #dcfce7, #f1f5f9 42%);
    }
    .app { max-width: 430px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #14532d, #166534);
      color: white; padding: 26px 22px; border-radius: 22px;
      text-align: center; box-shadow: 0 10px 28px #14532d25;
    }
    .header h1 { margin: 0 0 10px; font-size: 27px; }
    .balance { font-size: 38px; font-weight: 800; margin: 14px 0 6px; color: #fde68a; }
    .card {
      background: white; padding: 20px; border-radius: 18px;
      margin-top: 18px; box-shadow: 0 5px 20px #0f172a0b;
    }
    h2, h3 { margin-top: 0; }
    button {
      width: 100%; padding: 16px; border: 0; border-radius: 13px;
      font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 12px;
    }
    .earn { background: #16a34a; color: white; }
    .secondary { background: #e2e8f0; color: #0f172a; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { text-align: center; font-size: 14px; margin-top: 15px; color: #475569; line-height: 1.5; }
    .note { font-size: 13px; color: #64748b; line-height: 1.6; }
    .pill { display: inline-block; background: #dcfce7; color: #166534; padding: 6px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <h1>🪙 Reward BD</h1>
      <p>Watch Ads &amp; Collect Coins</p>
      <div class="balance"><span id="balance">0</span> 🪙</div>
      <p>Your Demo Balance</p>
      <span class="pill">DEMO VERSION</span>
    </section>

    <section class="card">
      <h2>🎁 Earn Coins</h2>
      <p>Watch a rewarded advertisement and earn 10 demo coins.</p>
      <button class="earn" id="watchBtn">▶ Watch Ad &amp; Earn 10 Coins</button>
      <div id="status" role="status" aria-live="polite">Ready to start.</div>
    </section>

    <section class="card">
      <h3>👤 Your Account</h3>
      <p id="username">Telegram User</p>
      <p class="note">This is a demo application. Coins are not real money and cannot be withdrawn.</p>
      <button class="secondary" id="refreshBtn">Refresh Demo Balance</button>
    </section>
  </main>

  <script>
    // Initialize Telegram Mini App
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (user) {
        document.getElementById("username").textContent =
          user.first_name || "Telegram User";
      }
    }

    // Demo-only balance saved in this browser/device.
    // Do not use localStorage as proof of real rewards or withdrawals.
    let balance = Number(localStorage.getItem("reward_bd_demo_balance") || 0);
    const balanceEl = document.getElementById("balance");
    const statusEl = document.getElementById("status");
    const watchBtn = document.getElementById("watchBtn");

    function updateBalance() {
      balanceEl.textContent = String(balance);
      localStorage.setItem("reward_bd_demo_balance", String(balance));
    }
    updateBalance();

    watchBtn.addEventListener("click", async () => {
      watchBtn.disabled = true;
      statusEl.textContent = "Checking ad setup…";

      try {
        /*
          Monetag integration is intentionally not activated until you paste
          the actual SDK tag and zone/function name from your Monetag account.

          Replace YOUR_ZONE_ID with your actual zone ID after adding the
          official SDK script provided by Monetag. The SDK API and reward
          callback must match the integration instructions shown in your
          Monetag dashboard.
        */
        const zoneId = "YOUR_ZONE_ID";
        const showAd = window["show_" + zoneId];

        if (typeof showAd !== "function") {
          statusEl.textContent =
            "Monetag SDK is not configured yet. Add your official Monetag SDK tag and Zone ID.";
          return;
        }

        const result = await showAd({
          type: "end",
          requestVar: "reward_button",
          catchIfNoFeed: true
        });

        // Demo-only reward example. This client-side balance is not secure.
        if (result && result.reward_event_type === "valued") {
          balance += 10;
          updateBalance();
          statusEl.textContent = "Demo: ad completed. +10 demo coins.";
        } else {
          statusEl.textContent = "No confirmed valued ad. No coins added.";
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Ad unavailable or SDK integration needs checking.";
      } finally {
        watchBtn.disabled = false;
      }
    });

    document.getElementById("refreshBtn").addEventListener("click", () => {
      balance = Number(localStorage.getItem("reward_bd_demo_balance") || 0);
      updateBalance();
      statusEl.textContent = "Demo balance refreshed.";
    });
    const watchBtn = document.getElementById("watchBtn");
const statusEl = document.getElementById("status");

watchBtn.addEventListener("click", async () => {
  watchBtn.disabled = true;
  statusEl.textContent = "বিজ্ঞাপন লোড হচ্ছে...";

  try {
    await show_1878821({
      ymid: String(
        window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "demo"
      ),
      requestVar: "reward_button"
    });

    statusEl.textContent =
      "বিজ্ঞাপন সম্পন্ন হয়েছে।";

  } catch (error) {
    statusEl.textContent =
      "বিজ্ঞাপন দেখানো যায়নি। আবার চেষ্টা করুন।";
  } finally {
    watchBtn.disabled = false;
  }
});
  </script>
</body>
</html>
